# ── PHASE 1 nginx: HTTP only (use while testing on the raw server IP) ──
# Serves the owner/staff panel + customer pages from /usr/share/nginx/html,
# and reverse-proxies the JSON API to the app container on :8000.
# Swap to nginx.conf (HTTPS) once you have a domain + certificate.
# Mounted at /etc/nginx/conf.d/default.conf

upstream chat_app {
    server app:8000;
    keepalive 16;
}
limit_req_zone $binary_remote_addr zone=chat_rl:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # allow the inventory Excel upload (default nginx cap is 1m)
    client_max_body_size 15m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # never serve source / data / secrets even if they sit under the web root
    location ~* \.(py|pyc|db|log|xlsx|xlsm|env|sh|md)$ { return 404; }
    location ^~ /data/ { return 404; }

    # ── JSON API → app container (same origin as the pages) ──
    location = /health { proxy_pass http://chat_app/health; }

    location = /chat {
        limit_req zone=chat_rl burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://chat_app/chat;
    }

    location /auth/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://chat_app;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;               # inventory upload/refresh can be slow
        proxy_pass http://chat_app;
    }

    # ── Developer Dashboard: page at /developer, read-only monitoring API
    #    under /developer/ (proxied). The app still enforces a Developer
    #    session on every /developer/* endpoint (developer_auth). ──
    location = /developer { try_files /inventory_system/developer_dashboard.html =404; }
    location /developer/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://chat_app;
    }

    # ── everything else = static files (panel HTML, customer chat page) ──
    location / {
        try_files $uri $uri/ =404;
    }
}
