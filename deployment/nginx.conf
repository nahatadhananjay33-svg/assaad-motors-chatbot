# ── PHASE 2 nginx: HTTPS (use once you have a domain + Let's Encrypt cert) ──
# Serves the owner/staff panel + customer pages, reverse-proxies the JSON API,
# terminates TLS, redirects HTTP->HTTPS, serves ACME challenges for certbot.
# Set `server_name` below to your real domain.  Mounted at /etc/nginx/conf.d/default.conf

upstream chat_app {
    server app:8000;
    keepalive 16;
}
# Inventory Excel editor (separate internal container; see docker-compose.yml).
upstream editor_up {
    server editor:8010;
    keepalive 8;
}
limit_req_zone $binary_remote_addr zone=chat_rl:10m rate=10r/s;

# ── HTTP: ACME challenge + redirect everything to HTTPS ──
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com;              # <-- CHANGE to your domain

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 15m;                # allow the inventory Excel upload

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # never serve source / data / secrets even if they sit under the web root
    location ~* \.(py|pyc|db|log|xlsx|xlsm|env|sh|md)$ { return 404; }
    location ^~ /data/ { return 404; }

    # ── JSON API → app container (same origin as the pages) ──
    location = /health { proxy_pass http://chat_app/health; }

    # customer vehicle detail (public, read-only): GET /vehicle?reg=<reg>
    location = /vehicle {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://chat_app/vehicle;
    }

    location = /chat {
        limit_req zone=chat_rl burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://chat_app/chat;
    }

    location /auth/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://chat_app;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;               # inventory upload/refresh can be slow
        proxy_pass http://chat_app;
    }

    # ── Developer Dashboard: page at /developer, read-only monitoring API
    #    under /developer/ (proxied). The app still enforces a Developer
    #    session on every /developer/* endpoint (developer_auth). ──
    location = /developer { try_files /inventory_system/developer_dashboard.html =404; }
    location /developer/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://chat_app;
    }

    # ── Inventory Excel editor (internal `editor` container) ──
    #    NOTE: Basic Auth was REMOVED at the owner's explicit request — the editor
    #    (page + assets /editor, /editor.js, /editor.css and its JSON API
    #    /api/sheets, /api/data, /api/save) is now OPEN to anyone with the URL and
    #    can edit/replace the live inventory workbook. To re-protect it, restore the
    #    two `auth_basic` / `auth_basic_user_file` lines in each location below.
    location /editor {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://editor_up;
    }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;                # workbook save can take a moment
        proxy_pass http://editor_up;
    }

    # ── everything else = static files (panel HTML, customer chat page) ──
    location / { try_files $uri $uri/ =404; }
}
