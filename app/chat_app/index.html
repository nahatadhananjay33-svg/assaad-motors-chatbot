<!DOCTYPE html>
<!-- Phase 11A — Assad Motors standalone chat app (frontend only).
     Talks to the existing backend POST /chat — no backend changes.
     Plain HTML/CSS/JS. No frameworks. Deploy target: chat.assadmotors.com -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Assad Motors — Chat</title>
  <meta name="description" content="Chat with Assad Motors — premium pre-owned cars." />
  <link rel="stylesheet" href="style.css?v=20260806" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%232563eb'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='white' font-family='Arial'>A</text></svg>" />
</head>
<body>

  <!-- ── Sidebar (desktop) / drawer (mobile) ── -->
  <aside id="sidebar" aria-label="Conversations">
    <button id="newChatBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      New Chat
    </button>
    <div id="recentLabel">Recent</div>
    <nav id="recentList" aria-label="Recent conversations"></nav>
    <div id="sidebarFooter"></div>
  </aside>
  <div id="scrim" hidden></div>

  <!-- ── Main column ── -->
  <div id="main">
    <header id="topbar">
      <button id="menuBtn" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div id="brand">
        <div id="logo" aria-hidden="true"></div>
        <div id="brandText">
          <div id="brandName"></div>
          <div id="brandTag"></div>
        </div>
      </div>
      <div id="headerActions">
        <a id="igLink" class="hbtn" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.2" cy="6.8" r="1.3" fill="currentColor"/></svg>
        </a>
        <a id="waLink" class="hbtn" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" title="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.8 8.4c.7 2.9 3 5.2 5.9 5.9l.9-1.6 2 .9c-.3 1.7-1.6 2.4-3.2 2a10.6 10.6 0 0 1-7-7c-.4-1.6.3-2.9 2-3.2l.9 2-1.5.9Z" fill="currentColor"/></svg>
        </a>
        <a id="callLink" class="hbtn" aria-label="Call us" title="Call">
          <svg viewBox="0 0 24 24"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </header>

    <main id="chatScroll">
      <div id="conversation">
        <!-- Welcome screen (removed after first message) -->
        <section id="welcome">
          <div id="welcomeEmoji">👋</div>
          <h1 id="welcomeTitle"></h1>
          <p id="welcomeSub"></p>
          <div id="chips"></div>
        </section>
        <!-- messages appended here -->
      </div>
    </main>

    <div id="composerWrap">
      <form id="composer">
        <textarea id="input" rows="1" autocomplete="off" enterkeyhint="send"></textarea>
        <button id="micBtn" type="button" disabled aria-label="Voice input (coming soon)" title="Voice input — coming soon">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="sendBtn" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div id="footerNote"></div>
    </div>
  </div>

  <script src="config.js?v=20260819"></script>
  <script src="app.js?v=20260819"></script>
</body>
</html>
