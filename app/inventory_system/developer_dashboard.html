<!DOCTYPE html>
<!--
  Developer Dashboard — Eagle-Eye Monitoring (read-only).
  Single self-contained page (no frameworks, no external assets). Talks only to
  the /developer/* read-only APIs with the existing X-Session-Token. Contains NO
  secrets. Access requires an active "Developer" session; the guard below
  redirects everyone else to the login page.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Developer Dashboard — Assad Motors</title>
  <style>
    :root {
      --bg:#f4f6f9; --panel:#fff; --ink:#102a43; --muted:#627d98; --line:#e1e8ef;
      --brand:#1f3a5f; --brand2:#2e75b6; --green:#0a8754; --greenbg:#e3f5ec;
      --red:#c0392b; --redbg:#fdeceb; --yellow:#b7791f; --yellowbg:#fbf3e0;
      --chip:#eef2f7;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--ink); }
    a { color:var(--brand2); }
    /* top bar */
    header { background:var(--brand); color:#fff; padding:12px 18px; display:flex;
             align-items:center; gap:14px; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; letter-spacing:.5px; font-weight:700; }
    header h1 small { display:block; font-size:11px; opacity:.75; font-weight:400; letter-spacing:2px; }
    header .spacer { flex:1; }
    .badge { font-size:11px; padding:3px 9px; border-radius:20px; background:rgba(255,255,255,.15); }
    header button { background:rgba(255,255,255,.16); color:#fff; border:0; border-radius:7px;
                    padding:7px 12px; font-size:13px; cursor:pointer; }
    header button:hover { background:rgba(255,255,255,.28); }
    #updated { font-size:11px; opacity:.8; }
    /* layout */
    .wrap { display:flex; min-height:calc(100vh - 49px); }
    nav { width:190px; background:var(--panel); border-right:1px solid var(--line); padding:12px 0; }
    nav a { display:block; padding:11px 20px; color:var(--muted); text-decoration:none; font-size:14px;
            border-left:3px solid transparent; cursor:pointer; }
    nav a:hover { background:var(--bg); }
    nav a.active { color:var(--brand); font-weight:600; border-left-color:var(--brand2); background:var(--bg); }
    main { flex:1; padding:20px; overflow-x:hidden; }
    h2.sec { font-size:18px; margin:0 0 14px; }
    /* cards */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 16px; }
    .card h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
    .kv { display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
    .kv b { font-weight:600; }
    .big { font-size:30px; font-weight:700; line-height:1.1; }
    .sub { font-size:12px; color:var(--muted); }
    /* attention */
    .attention { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:16px; }
    .att-row { display:flex; align-items:center; gap:9px; padding:5px 0; font-size:14px; }
    .dot { width:10px; height:10px; border-radius:50%; flex:none; }
    .dot.green{background:var(--green)} .dot.red{background:var(--red)} .dot.yellow{background:var(--yellow)}
    .pill { font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; display:inline-block; }
    .pill.green{background:var(--greenbg);color:var(--green)} .pill.red{background:var(--redbg);color:var(--red)}
    .pill.yellow{background:var(--yellowbg);color:var(--yellow)} .pill.gray{background:var(--chip);color:var(--muted)}
    /* filters */
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
    .chip { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:6px 13px;
            font-size:13px; cursor:pointer; color:var(--muted); }
    .chip.active { background:var(--brand2); color:#fff; border-color:var(--brand2); }
    /* clickable Admin-Activity drill-down cards */
    .actcard { cursor:pointer; user-select:none; transition:box-shadow .12s, border-color .12s, transform .02s; }
    .actcard:hover { border-color:var(--brand2); box-shadow:0 2px 10px rgba(46,117,182,.14); }
    .actcard:active { transform:translateY(1px); }
    .actcard.on { border-color:var(--brand2); box-shadow:0 0 0 2px var(--brand2) inset; background:#eef6fd; }
    .actcard h3 { display:flex; align-items:center; gap:8px; }
    .actbanner { background:var(--panel); border:1px solid var(--line); border-radius:10px;
                 padding:9px 14px; margin-bottom:12px; font-size:14px; display:flex;
                 align-items:center; gap:10px; flex-wrap:wrap; }
    .clearbtn { cursor:pointer; }
    input[type=text], select { padding:7px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; }
    /* tables */
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line);
            border-radius:12px; overflow:hidden; font-size:13px; }
    th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { background:#f8fafc; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
    tr:last-child td { border-bottom:0; }
    tr.click { cursor:pointer; } tr.click:hover td { background:#f8fafc; }
    .tbl-wrap { overflow-x:auto; }
    .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
    .muted { color:var(--muted); }
    /* pagination */
    .pager { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:13px; }
    .pager button { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer; }
    .pager button:disabled { opacity:.4; cursor:default; }
    /* bars */
    .bar-row { display:grid; grid-template-columns:130px 1fr 46px; gap:10px; align-items:center; font-size:13px; padding:3px 0; }
    .bar { height:14px; background:var(--brand2); border-radius:4px; min-width:2px; }
    .bar.alt { background:#7aa5cf; }
    /* slide-over detail */
    #overlay { position:fixed; inset:0; background:rgba(16,42,67,.4); display:none; }
    #detail { position:fixed; top:0; right:0; width:min(560px,96vw); height:100%; background:var(--bg);
              box-shadow:-4px 0 24px rgba(0,0,0,.2); overflow-y:auto; padding:18px; }
    #detail h3 { margin:0 0 4px; }
    .turn { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin:10px 0; }
    .turn .q { font-weight:600; }
    .turn .a { margin-top:6px; color:#243b53; white-space:pre-wrap; }
    .turn .meta { margin-top:7px; font-size:11px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 12px; }
    .close-x { float:right; cursor:pointer; border:0; background:var(--chip); border-radius:7px; padding:6px 11px; }
    .chips-list { display:flex; flex-wrap:wrap; gap:6px; }
    .tag { background:var(--chip); border-radius:6px; padding:3px 8px; font-size:12px; }
    .empty { color:var(--muted); font-size:14px; padding:24px; text-align:center; }
    @media (max-width:720px){ .wrap{flex-direction:column} nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)} nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap} nav a.active{border-left:0;border-bottom-color:var(--brand2)} }
  </style>
</head>
<body>
  <header>
    <h1>ASSAD MOTORS<small>DEVELOPER DASHBOARD</small></h1>
    <span class="badge" id="envBadge">—</span>
    <div class="spacer"></div>
    <span id="updated">—</span>
    <button id="refreshBtn" title="Refresh now">↻ Refresh</button>
    <button id="logoutBtn">Logout</button>
  </header>

  <div class="wrap">
    <nav id="nav">
      <a data-tab="overview" class="active">Overview</a>
      <a data-tab="chats">Chats</a>
      <a data-tab="activity">Admin Activity</a>
      <a data-tab="inventory">Inventory</a>
      <a data-tab="analytics">Analytics</a>
      <a data-tab="errors">Errors</a>
      <a data-tab="health">System Health</a>
    </nav>
    <main id="main"><div class="empty">Loading…</div></main>
  </div>

  <div id="overlay"><div id="detail"></div></div>

<script>
"use strict";
// ── config / auth ────────────────────────────────────────────────────────────
var $ = function (id) { return document.getElementById(id); };
function base() {
  var saved = localStorage.getItem("auth_base");
  var host = location.hostname;
  var isLocal = host === "localhost" || host === "127.0.0.1" || location.protocol === "file:";
  if (saved && !(isLocal && /:8080\/?$/.test(saved))) return saved.replace(/\/+$/, "");
  return isLocal ? "http://localhost:8000" : location.origin;
}
function token() { return localStorage.getItem("auth_token") || ""; }
function toLogin() { location.href = "login.html"; }

function api(path) {
  return fetch(base() + path, { headers: { "X-Session-Token": token() } })
    .then(function (r) {
      // 401 (no/expired session) and 403 (fail-closed edge gate on an expired
      // session) both mean "log in again" — only Developers reach this page, so
      // a 403 here is an expired session, never a wrong-role user.
      if (r.status === 401 || r.status === 403) { toLogin(); throw new Error("unauth"); }
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.detail || "Request failed"); return d; });
    });
}

// ── small helpers ────────────────────────────────────────────────────────────
function esc(s){ s=(s==null?"":String(s)); return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function num(n){ return (n==null)?"—":Number(n).toLocaleString("en-IN"); }
function ms(n){ return (n==null)?"—":Math.round(n)+" ms"; }
function shortId(s){ s=String(s||""); return s.length>12? s.slice(0,10)+"…" : s; }
function fmt(ts){ if(!ts) return "—"; var d=new Date(ts); if(isNaN(d)) return esc(ts); return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }
function ago(ts){ if(!ts) return ""; var d=new Date(ts); if(isNaN(d)) return ""; var s=(Date.now()-d.getTime())/1000;
  if(s<60) return Math.floor(s)+"s ago"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }
function dur(sec){ if(sec==null) return "—"; if(sec<60) return sec+"s"; var m=Math.floor(sec/60); return m+"m "+(sec%60)+"s"; }
function statusPill(s){ s=String(s||"").toLowerCase();
  if(["ok","healthy","ready","success"].indexOf(s)>=0) return '<span class="pill green">'+esc(s)+'</span>';
  if(["empty","degraded","failed","not_configured","unavailable","unreachable"].indexOf(s)>=0) return '<span class="pill red">'+esc(s)+'</span>';
  return '<span class="pill gray">'+esc(s)+'</span>'; }

// ── tab machinery ────────────────────────────────────────────────────────────
var TAB = "overview", timer = null, lastFilters = {};
var tabs = document.querySelectorAll("#nav a");
tabs.forEach(function(a){ a.onclick=function(){ setTab(a.dataset.tab); }; });
function setTab(t){ TAB=t; tabs.forEach(function(a){ a.classList.toggle("active", a.dataset.tab===t); });
  lastFilters={}; render(); }
$("refreshBtn").onclick=function(){ render(); };
$("logoutBtn").onclick=function(){
  fetch(base()+"/auth/logout",{method:"POST",headers:{"X-Session-Token":token()}}).catch(function(){})
    .finally(function(){ localStorage.removeItem("auth_token"); toLogin(); });
};
function stamp(){ $("updated").textContent="Updated "+new Date().toLocaleTimeString("en-IN"); }
function schedulePoll(){ if(timer) clearTimeout(timer); timer=setTimeout(function(){ render(true); }, 30000); }

function render(isPoll){
  var m=$("main");
  var fn = ({overview:vOverview,chats:vChats,activity:vActivity,inventory:vInventory,
             analytics:vAnalytics,errors:vErrors,health:vHealth})[TAB];
  if(!fn) return;
  fn(m, isPoll).then(function(){ stamp(); schedulePoll(); })
    .catch(function(e){ if(String(e.message)!=="unauth") m.innerHTML='<div class="empty">⚠ '+esc(e.message)+'</div>'; });
}

// ── OVERVIEW ─────────────────────────────────────────────────────────────────
function card(title, body){ return '<div class="card"><h3>'+title+'</h3>'+body+'</div>'; }
function kv(k,v){ return '<div class="kv"><span class="muted">'+k+'</span><b>'+v+'</b></div>'; }
function vOverview(m){
  return api("/developer/overview").then(function(d){
    var att = (d.needs_attention||[]).map(function(a){
      return '<div class="att-row"><span class="dot '+esc(a.level)+'"></span>'+esc(a.text)+'</div>'; }).join("");
    var c=d.chatbot||{}, s=d.system||{}, inv=d.inventory||{}, ad=d.admin||{}, h=d.health||{};
    var recent=(ad.recent||[]).slice(0,6).map(function(e){
      return '<div class="kv"><span class="muted">'+esc(e.action)+(e.vehicle?' · '+esc(e.vehicle):'')+'</span><span class="sub">'+ago(e.ts)+'</span></div>'; }).join("") || '<div class="sub">No recent actions.</div>';
    m.innerHTML =
      '<h2 class="sec">Eagle View</h2>'+
      '<div class="attention"><h3 style="margin:0 0 6px;font-size:12px;letter-spacing:1px;color:var(--muted)">NEEDS ATTENTION</h3>'+att+'</div>'+
      '<div class="grid">'+
        card("System",
          '<div class="kv"><span class="muted">API</span>'+statusPill(s.api_status)+'</div>'+
          kv("Environment", esc(s.environment))+ kv("Version", esc(s.version))+
          kv("Commit", '<span class="mono">'+esc((s.commit||"").slice(0,8))+'</span>')+
          kv("Uptime", dur(s.uptime_seconds))+ kv("Inventory", num(s.inventory_count)))+
        card("Chatbot",
          '<div class="big">'+num(c.conversations_today)+'</div><div class="sub">conversations today · '+num(c.conversations_7d)+' this week</div>'+
          kv("Messages today", num(c.messages_today))+ kv("Active sessions", num(c.active_sessions))+
          kv("Avg response", ms(c.avg_response_ms_all))+ kv("Total sessions", num(c.total_sessions)))+
        card("Inventory",
          '<div class="big">'+num(inv.count)+'</div><div class="sub">'+num(inv.model_count)+' models · '+num(inv.brand_count)+' brands</div>'+
          kv("Last refresh", fmt(inv.last_refresh))+'<div class="sub">'+ago(inv.last_refresh)+'</div>')+
        card("Admin (today)",
          kv("Logins", num(ad.logins_today))+ kv("Inventory edits", num(ad.inventory_edits_today))+
          kv("Excel uploads", num(ad.uploads_today))+ kv("Media actions", num(ad.media_actions_today))+
          '<h3 style="margin:12px 0 4px">Recent</h3>'+recent)+
        card("Health",
          '<div class="kv"><span class="muted">API</span>'+statusPill(h.api)+'</div>'+
          '<div class="kv"><span class="muted">Inventory</span>'+statusPill(h.inventory)+'</div>'+
          '<div class="kv"><span class="muted">Supabase</span>'+statusPill(h.supabase)+'</div>'+
          kv("Errors today", num(h.errors_today)))+
      '</div>';
  });
}

// ── CHATS ────────────────────────────────────────────────────────────────────
var chatState = { page:0, range:"", q:"", intent:"", language:"", errors_only:"", slow_only:"" };
function vChats(m){
  // Rebuild the filter+table shell whenever it isn't currently in the DOM
  // (other tabs overwrite <main>, so returning to Chats must re-create it).
  if(!document.getElementById("chatTable")){ buildChatShell(m); }
  return loadChats();
}
function buildChatShell(m){
  m.innerHTML =
    '<h2 class="sec">Conversations</h2>'+
    '<div class="filters" id="chatFilters">'+
      rangeChips()+
      '<input type="text" id="cq" placeholder="search question / reply…" style="min-width:190px">'+
      '<input type="text" id="cintent" placeholder="intent" style="width:110px">'+
      '<input type="text" id="clang" placeholder="language" style="width:110px">'+
      '<label class="chip"><input type="checkbox" id="cerr"> unanswered</label>'+
      '<label class="chip"><input type="checkbox" id="cslow"> slow</label>'+
    '</div>'+
    '<div id="chatTable" class="tbl-wrap"></div><div id="chatPager" class="pager"></div>';
  m.querySelectorAll("#chatFilters .chip[data-range]").forEach(function(ch){
    ch.onclick=function(){ chatState.range = (chatState.range===ch.dataset.range)?"":ch.dataset.range; chatState.page=0; syncChips(); loadChats(); };
  });
  var deb;
  ["cq","cintent","clang"].forEach(function(id){ $(id).oninput=function(){ clearTimeout(deb); deb=setTimeout(function(){
    chatState.q=$("cq").value.trim(); chatState.intent=$("cintent").value.trim(); chatState.language=$("clang").value.trim();
    chatState.page=0; loadChats(); }, 350); }; });
  $("cerr").onchange=function(){ chatState.errors_only=this.checked?"1":""; chatState.page=0; loadChats(); };
  $("cslow").onchange=function(){ chatState.slow_only=this.checked?"1":""; chatState.page=0; loadChats(); };
}
function rangeChips(){ return ['today','yesterday','7d','30d'].map(function(r){
  return '<span class="chip" data-range="'+r+'">'+r+'</span>'; }).join(""); }
function syncChips(){ document.querySelectorAll('#chatFilters .chip[data-range]').forEach(function(ch){
  ch.classList.toggle("active", ch.dataset.range===chatState.range); }); }
function loadChats(){
  var qs="?page="+chatState.page+"&page_size=25";
  ["range","q","intent","language","errors_only","slow_only"].forEach(function(k){
    if(chatState[k]) qs+="&"+(k==="q"?"q":k)+"="+encodeURIComponent(chatState[k]); });
  return api("/developer/chats"+qs).then(function(d){
    if(!d.available){ $("chatTable").innerHTML='<div class="empty">No conversation log available.</div>'; $("chatPager").innerHTML=""; return; }
    if(!d.sessions.length){ $("chatTable").innerHTML='<div class="empty">No conversations match.</div>'; }
    else {
      var rows=d.sessions.map(function(s){
        var badges=(s.unknown_count?'<span class="pill yellow">'+s.unknown_count+' unanswered</span> ':'')+
                   (s.slow?'<span class="pill red">slow</span>':'');
        return '<tr class="click" data-sid="'+esc(s.session_id)+'">'+
          '<td class="mono">'+esc(shortId(s.session_id))+'</td>'+
          '<td>'+fmt(s.started)+'</td><td>'+fmt(s.last_activity)+'<div class="sub">'+ago(s.last_activity)+'</div></td>'+
          '<td>'+num(s.messages)+'</td>'+
          '<td>'+(s.languages||[]).map(function(l){return '<span class="tag">'+esc(l)+'</span>';}).join(" ")+'</td>'+
          '<td>'+ms(s.avg_response_ms)+'<div class="sub">max '+ms(s.max_response_ms)+'</div></td>'+
          '<td>'+badges+'</td></tr>'; }).join("");
      $("chatTable").innerHTML='<table><thead><tr><th>Session</th><th>Started</th><th>Last activity</th><th>Msgs</th><th>Lang</th><th>Response</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
      $("chatTable").querySelectorAll("tr.click").forEach(function(tr){ tr.onclick=function(){ openDetail(tr.dataset.sid); }; });
    }
    var totPages=d.pages||0;
    $("chatPager").innerHTML='<button id="prev" '+(chatState.page<=0?"disabled":"")+'>‹ Prev</button>'+
      '<span>Page '+(chatState.page+1)+' / '+Math.max(1,totPages)+' · '+num(d.total)+' sessions</span>'+
      '<button id="next" '+(chatState.page+1>=totPages?"disabled":"")+'>Next ›</button>';
    if($("prev")) $("prev").onclick=function(){ if(chatState.page>0){chatState.page--; loadChats();} };
    if($("next")) $("next").onclick=function(){ if(chatState.page+1<totPages){chatState.page++; loadChats();} };
  });
}
function openDetail(sid){
  $("overlay").style.display="block";
  $("detail").innerHTML='<button class="close-x" onclick="closeDetail()">✕ Close</button><div class="empty">Loading…</div>';
  api("/developer/chats/"+encodeURIComponent(sid)).then(function(d){
    var turns=(d.turns||[]).map(function(t){
      var meta=[t.intent?"intent: "+esc(t.intent):"", t.language?"lang: "+esc(t.language):"",
        t.route?"route: "+esc(t.route):"", t.vehicles?"cars: "+esc(t.vehicles):"",
        (t.response_ms!=null?"⏱ "+ms(t.response_ms):""), t.unknown?"⚠ unanswered":""]
        .filter(Boolean).map(function(x){return '<span>'+x+'</span>';}).join("");
      return '<div class="turn"><div class="q">🧑 '+esc(t.customer)+'</div>'+
        '<div class="a">🤖 '+esc(t.bot||"—")+'</div><div class="meta">'+meta+' <span class="muted">'+fmt(t.timestamp)+'</span></div></div>'; }).join("");
    $("detail").innerHTML='<button class="close-x" onclick="closeDetail()">✕ Close</button>'+
      '<h3>Session</h3><div class="mono sub">'+esc(d.session_id)+'</div>'+
      '<div class="grid" style="grid-template-columns:1fr 1fr;margin:12px 0">'+
        card("Timeline", kv("Started",fmt(d.started))+kv("Last active",fmt(d.last_activity))+kv("Duration",dur(d.duration_seconds)))+
        card("Summary", kv("Messages",num(d.messages))+kv("Languages",(d.languages||[]).join(", ")||"—")+
          kv("Unanswered",num(d.unanswered))+kv("Visit-ready",d.visit_ready?"yes":"no"))+
      '</div><h3>Turns</h3>'+turns;
  }).catch(function(e){ $("detail").innerHTML='<button class="close-x" onclick="closeDetail()">✕ Close</button><div class="empty">⚠ '+esc(e.message)+'</div>'; });
}
function closeDetail(){ $("overlay").style.display="none"; }
$("overlay").onclick=function(e){ if(e.target===$("overlay")) closeDetail(); };

// ── ADMIN ACTIVITY (clickable card drill-down) ───────────────────────────────
var activityType = "";     // "" = all activity;  else a card id (matches backend)
var ACTIVITY_CARDS = [
  {id:"login",  label:"Logins",        key:"logins"},
  {id:"excel",  label:"Excel uploads", key:"excel_uploads"},
  {id:"edit",   label:"Car edits",     key:"car_edits"},
  {id:"add",    label:"Car adds",      key:"car_adds"},
  {id:"sold",   label:"Sold",          key:"sold"},
  {id:"media",  label:"Media",         key:"media"},
  {id:"users",  label:"User mgmt",     key:"user_mgmt"},
  {id:"failed", label:"Failed",        key:"failed"}
];
function actLabel(id){ var c=ACTIVITY_CARDS.filter(function(x){return x.id===id;})[0]; return c?c.label:id; }
function vActivity(m){
  var qs = "/developer/activity" + (activityType ? "?type="+encodeURIComponent(activityType) : "?limit=200");
  return api(qs).then(function(d){
    var t=d.today||{};
    var cardsHtml=ACTIVITY_CARDS.map(function(c){
      var on = activityType===c.id;
      return '<div class="card actcard'+(on?' on':'')+'" data-type="'+c.id+'" role="button" tabindex="0" '+
        'aria-pressed="'+on+'"><h3>'+c.label+' today'+(on?' <span class="pill green">ACTIVE</span>':'')+'</h3>'+
        '<div class="big">'+num(t[c.key])+'</div></div>'; }).join("");
    var banner = activityType
      ? '<div class="actbanner">Showing: <b>'+esc(actLabel(activityType))+'</b> activity today · <b>'+num(d.count)+
        '</b> record(s) <button id="clearAct" class="chip clearbtn">✕ Clear filter</button></div>'
      : '<div class="actbanner muted">Showing: <b>All activity</b> — click a card above to drill down.</div>';
    var rows=(d.events||[]).map(function(e){
      var chg = (e.old_value||e.new_value) ? (esc(e.old_value||"—")+" → "+esc(e.new_value||"—")) : (esc(e.detail||""));
      return '<tr><td>'+fmt(e.ts)+'</td><td>'+esc(e.username||"—")+'<div class="sub">'+esc(e.role||"")+'</div></td>'+
        '<td>'+esc(e.action)+'</td><td>'+esc(e.vehicle||"—")+'</td><td class="muted">'+chg+'</td>'+
        '<td>'+statusPill(e.status)+'</td></tr>'; }).join("");
    var emptyMsg = activityType ? 'No '+esc(actLabel(activityType))+' activity today.' : 'No activity yet.';
    m.innerHTML='<h2 class="sec">Admin Activity</h2><div class="grid" style="margin-bottom:14px">'+cardsHtml+'</div>'+
      banner+
      '<div class="tbl-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Vehicle</th><th>Change / details</th><th>Status</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan=6 class="empty">'+emptyMsg+'</td></tr>')+'</tbody></table></div>';
    function pick(ty){ activityType = (activityType===ty) ? "" : ty; vActivity($("main")); }  // toggle same card off; else replace
    m.querySelectorAll(".actcard").forEach(function(card){
      card.onclick=function(){ pick(card.dataset.type); };
      card.onkeydown=function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); pick(card.dataset.type); } };
    });
    var cl=$("clearAct"); if(cl) cl.onclick=function(ev){ ev.stopPropagation(); activityType=""; vActivity($("main")); };
  });
}

// ── INVENTORY ────────────────────────────────────────────────────────────────
function vInventory(m){
  return api("/developer/inventory").then(function(d){
    var sy=d.sync||{};
    function recent(list,label){ return card(label, (list&&list.length)? list.map(function(e){
      return '<div class="kv"><span>'+esc(e.vehicle||e.action)+'</span><span class="sub">'+ago(e.ts)+'</span></div>'; }).join("")
      : '<div class="sub">None.</div>'); }
    m.innerHTML='<h2 class="sec">Inventory</h2>'+
      '<div class="grid" style="margin-bottom:16px">'+
        '<div class="card"><h3>Live fleet</h3><div class="big">'+num(d.count)+'</div><div class="sub">'+num(d.model_count)+' models · '+num(d.brand_count)+' brands</div>'+
          kv("Last refresh",fmt(d.last_refresh))+kv("Last change",fmt(d.last_change))+'</div>'+
        '<div class="card"><h3>Inventory Sync Monitor</h3>'+
          '<div class="att-row"><span class="dot '+(sy.status==="healthy"?"green":sy.status==="empty"?"red":"yellow")+'"></span><b>'+esc((sy.status||"").toUpperCase())+'</b></div>'+
          '<div class="kv"><span class="muted">Cars loaded</span><b>'+num(sy.cars_loaded)+'</b></div>'+
          '<div class="kv"><span class="muted">Retrieval index</span>'+statusPill(sy.retrieval_index)+'</div>'+
          '<div class="kv"><span class="muted">Registration lookup</span>'+statusPill(sy.registration_lookup)+'</div>'+
          '<div class="kv"><span class="muted">Model recognizer</span>'+statusPill(sy.model_recognizer)+'</div>'+
          '<div class="sub">workbook: '+esc(sy.workbook||"—")+'</div></div>'+
        '<div class="card"><h3>Today</h3>'+kv("Added",num(d.added_today))+kv("Modified",num(d.modified_today))+kv("Removed",num(d.removed_today))+'</div>'+
        recent(d.recent_added,"Recently added")+ recent(d.recent_modified,"Recently modified")+ recent(d.recent_removed,"Recently removed")+
      '</div>'+
      '<div class="card"><h3>Models in stock ('+num(d.model_count)+')</h3><div class="chips-list">'+
        (d.models||[]).map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join("")+'</div></div>';
  });
}

// ── ANALYTICS ────────────────────────────────────────────────────────────────
function bars(items, keyName, valName, alt){
  var max=Math.max.apply(null,[1].concat(items.map(function(i){return i[valName]||0;})));
  return items.map(function(i){ var w=Math.round(100*(i[valName]||0)/max);
    return '<div class="bar-row"><span class="muted">'+esc(i[keyName]||"—")+'</span>'+
      '<span class="bar'+(alt?' alt':'')+'" style="width:'+w+'%"></span><b>'+num(i[valName])+'</b></div>'; }).join(""); }
function vAnalytics(m){
  return api("/developer/analytics").then(function(d){
    if(!d.available){ m.innerHTML='<div class="empty">No analytics available.</div>'; return; }
    var c=d.conversations||{};
    var trend = (d.trend_14d||[]);
    var tmax=Math.max.apply(null,[1].concat(trend.map(function(t){return t.messages;})));
    var trendBars=trend.map(function(t){ var h=Math.round(60*t.messages/tmax);
      return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px">'+
        '<div style="width:70%;background:var(--brand2);height:'+Math.max(2,h)+'px;border-radius:3px" title="'+t.messages+'"></div>'+
        '<span class="sub" style="font-size:9px">'+esc(t.day.slice(5))+'</span></div>'; }).join("");
    var unans=(d.unanswered||[]).slice(0,25).map(function(u){
      return '<tr><td>'+esc(u.query)+'</td><td>'+esc(u.language||"—")+'</td><td class="muted">'+esc(u.reason||"")+'</td><td class="sub">'+fmt(u.timestamp)+'</td></tr>'; }).join("");
    m.innerHTML='<h2 class="sec">Analytics</h2>'+
      '<div class="grid" style="margin-bottom:16px">'+
        '<div class="card"><h3>Conversations</h3>'+kv("Today",num(c.today))+kv("Yesterday",num(c.yesterday))+kv("Last 7 days",num(c.last_7d))+kv("Last 30 days",num(c.last_30d))+'</div>'+
        '<div class="card" style="grid-column:span 2"><h3>Messages · last 14 days</h3><div style="display:flex;gap:4px;height:78px;align-items:flex-end">'+trendBars+'</div></div>'+
      '</div>'+
      '<div class="grid">'+
        card("Popular intents", bars(d.top_intents||[],"intent","n"))+
        card("Popular models", bars(d.top_models||[],"model","n",true))+
        card("Languages", bars(d.top_languages||[],"language","n"))+
      '</div>'+
      '<h3 style="margin:18px 0 8px">Unanswered / clarification questions <span class="pill gray">'+num(d.unanswered_total)+' total</span></h3>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Question</th><th>Lang</th><th>Reason</th><th>When</th></tr></thead><tbody>'+
      (unans||'<tr><td colspan=4 class="empty">None 🎉</td></tr>')+'</tbody></table></div>';
  });
}

// ── ERRORS ───────────────────────────────────────────────────────────────────
var errSev="";
function vErrors(m){
  return api("/developer/errors?limit=200"+(errSev?"&severity="+errSev:"")).then(function(d){
    var rows=(d.errors||[]).map(function(e){
      var sev=e.severity==="HIGH"?'<span class="pill red">HIGH</span>':'<span class="pill yellow">'+esc(e.severity)+'</span>';
      return '<tr><td>'+fmt(e.ts)+'</td><td>'+sev+'</td><td>'+esc(e.event)+'</td>'+
        '<td class="mono">'+esc(e.method||"")+' '+esc(e.endpoint||"")+(e.status?' ['+e.status+']':'')+'</td>'+
        '<td class="muted">'+esc(e.message||"")+'</td><td class="mono sub">'+esc(shortId(e.session))+'</td></tr>'; }).join("");
    var fa=(d.failed_admin_actions||[]).map(function(e){
      return '<tr><td>'+fmt(e.ts)+'</td><td>'+esc(e.username||"—")+'</td><td>'+esc(e.action)+'</td><td class="muted">'+esc(e.detail||"")+'</td></tr>'; }).join("");
    m.innerHTML='<h2 class="sec">Errors</h2>'+
      '<div class="filters">'+['','HIGH','MEDIUM'].map(function(s){
        return '<span class="chip'+(errSev===s?' active':'')+'" data-sev="'+s+'">'+(s||"all")+'</span>'; }).join("")+
        '<span class="sub">in-memory ring · newest first · secrets & PII stripped</span></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Sev</th><th>Event</th><th>Endpoint</th><th>Message</th><th>Session</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan=6 class="empty">No errors captured. 🟢</td></tr>')+'</tbody></table></div>'+
      '<h3 style="margin:18px 0 8px">Failed admin actions (durable)</h3>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>'+
      (fa||'<tr><td colspan=4 class="empty">None.</td></tr>')+'</tbody></table></div>';
    m.querySelectorAll(".chip[data-sev]").forEach(function(ch){ ch.onclick=function(){ errSev=ch.dataset.sev; vErrors($("main")); }; });
  });
}

// ── SYSTEM HEALTH ────────────────────────────────────────────────────────────
function vHealth(m){
  return api("/developer/health").then(function(d){
    var b=d.backend||{}, i=d.inventory||{}, s=d.supabase||{}, a=d.application||{};
    m.innerHTML='<h2 class="sec">System Health</h2><div class="grid">'+
      card("Backend", '<div class="kv"><span class="muted">Status</span>'+statusPill(b.status)+'</div>'+
        kv("Uptime",dur(b.uptime_seconds))+kv("Requests logged",num(b.total_requests_logged))+
        kv("Errors today",num(b.errors_today))+kv("High severity",num(b.high_severity_today))+kv("Avg response",ms(b.avg_response_ms)))+
      card("Inventory", '<div class="kv"><span class="muted">Loaded</span>'+statusPill(i.loaded?"ok":"empty")+'</div>'+
        kv("Count",num(i.count))+kv("Last refresh",fmt(i.last_refresh))+kv("Refresh failures",num(i.refresh_failures_seen)))+
      card("Supabase", '<div class="kv"><span class="muted">Status</span>'+statusPill(s.status)+'</div>'+
        kv("Configured",s.configured?"yes":"no")+kv("Mode",esc(s.mode)))+
      card("Application", kv("Environment",esc(a.environment))+kv("Version",esc(a.version))+
        kv("Commit",'<span class="mono">'+esc((a.commit||"").slice(0,8))+'</span>')+kv("Started",fmt(a.started_at)))+
    '</div>';
  });
}

// ── boot: verify a Developer session, then render ────────────────────────────
(function boot(){
  if(!token()){ toLogin(); return; }
  api("/auth/me").then(function(d){
    if(!d.user || d.user.role!=="Developer"){
      $("main").innerHTML='<div class="empty">This dashboard is for the Developer account only.</div>';
      setTimeout(toLogin,1500); return;
    }
    $("envBadge").textContent = (d.user.username||"developer");
    render();
  }).catch(function(){ /* api() already redirects on 401 */ });
})();
</script>
