# Production stack: app (chat + panel API) + nginx (serves pages, reverse proxy).
# Usage:
#   cp .env.production.example .env      # then edit secrets/origins/domain
#   # populate the web root and seed the inventory workbook (see deployment/KVM2_DEPLOY.md)
#   docker compose up -d --build
#
# The inventory workbook lives in the writable ./data volume so the owner panel
# can upload/edit it and hot-reload with no restart. Backups land in
# ./data/inventory_backups. SQLite (users/leads/analytics/audit) also lives in ./data.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: assad-motors-chat:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - CHAT_DATA_DIR=/data
      - CHAT_XLSX=/data/IVR_Sheet.xlsx          # writable: panel upload/edit works
      - CHAT_HOST=0.0.0.0
      - CHAT_API_PORT=8000
    volumes:
      - ./data:/data                            # persistent: Excel + SQLite + backups
    expose:
      - "8000"                                  # internal only; nginx reaches it
    # No host port published — never expose the app directly.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # DEFAULT = PHASE 2 (domain / HTTPS) with nginx.conf — this is the live
      # production config; keeping it as the committed default means git pull /
      # stash / reset can never silently revert the server to HTTP (that once
      # caused a 403 outage). Certs live in the gitignored deployment/certs/.
      # For a fresh PHASE-1 (raw-IP / HTTP, no domain or certs) bootstrap only,
      # temporarily switch this line to ./deployment/nginx.http.conf.
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/web:/usr/share/nginx/html:ro       # panel + customer pages
      - ./deployment/certs:/etc/nginx/certs:ro          # fullchain.pem + privkey.pem (HTTPS)
      - ./deployment/certbot-webroot:/var/www/certbot   # ACME http-01 challenge (HTTPS)
